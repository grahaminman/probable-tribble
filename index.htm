<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probable Tribble</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="brand">
                <span class="logo"></span>
                Probable Tribble
            </div>
            <nav class="nav">
                <a href="#">Home</a>
                <a href="pages/about.htm">About</a>
                <a href="pages/contact.htm">Contact</a>
            </nav>
        </header>

        <div class="hero">
            <div>
                <h1>Welcome to the Party Pal!</h1>
                <p>This is a simple template for GitHub Pages with dynamic content loading.</p>
            </div>
            <button class="btn btn-primary">Get Started</button>
        </div>

        <div class="row">
            <!-- Left sidebar with links -->
            <div class="card alt">
                <h3>Pages</h3>
                <ul class="sidebar">
                    <li><a href="pages/pageone.htm">Page One</a></li>
                    <li><a href="pages/pagetwo.htm">Page Two</a></li>
                    <li><a href="pages/pagethree.htm">Page Three</a></li>
                    <li><a href="pages/pagefour.htm">Page Four</a></li>
                    <!-- Add more links here as needed, e.g., <li><a href="another-page.html">Another Topic</a></li> -->
                </ul>
            </div>
            <!-- Right main content area (initially with welcome content; updated dynamically) -->
            <div id="main-content" class="card">
                <h3>Main Content</h3>
                <p>Select a page from the left sidebar to load content here.</p>
            </div>
        </div>

        <footer class="footer">
            &copy;  <script>document.write( new Date().getFullYear() );</script> Your Name.
        </footer>
    </div>
    <script src="assets/js/script.js"></script>

</html>
